name: CD — Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ── Build & Push Docker Images ──────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (git SHA short)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API Gateway ──────────────────────────────────────────────
      - name: Build & push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/aegis-api-gateway:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME }}/aegis-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Auth Service ─────────────────────────────────────────────
      - name: Build & push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/aegis-auth-service:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME }}/aegis-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── User Service ─────────────────────────────────────────────
      - name: Build & push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/aegis-user-service:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME }}/aegis-user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Order Service ────────────────────────────────────────────
      - name: Build & push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/aegis-order-service:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME }}/aegis-order-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to k3s on EC2 ────────────────────────────────────────────────────
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      # Fetch kubeconfig from EC2, replace 127.0.0.1 with the real EC2 IP
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          ssh -i <(echo "${{ secrets.EC2_SSH_KEY }}") \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.EC2_HOST }} \
              'sudo cat /etc/rancher/k3s/k3s.yaml' \
          | sed "s/127.0.0.1/${{ secrets.EC2_HOST }}/g" \
          > ~/.kube/config
          chmod 600 ~/.kube/config

      # Create / update aegis-secrets from GitHub Secrets
      - name: Apply Kubernetes secrets
        run: |
          kubectl create secret generic aegis-secrets \
            --namespace=aegis \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Apply all manifests (namespace first, then infra, then services)
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f infra/k8s/00-namespace.yaml
          kubectl apply -f infra/k8s/postgres/
          kubectl apply -f infra/k8s/redis/
          kubectl apply -f infra/k8s/auth-service/
          kubectl apply -f infra/k8s/user-service/
          kubectl apply -f infra/k8s/order-service/
          kubectl apply -f infra/k8s/api-gateway/

      # Update deployments with the exact image SHA — triggers rolling update
      - name: Roll out new images
        run: |
          TAG=${{ needs.build-push.outputs.image_tag }}

          kubectl set image deployment/api-gateway \
            api-gateway=${{ env.DOCKERHUB_USERNAME }}/aegis-api-gateway:$TAG \
            -n aegis

          kubectl set image deployment/auth-service \
            auth-service=${{ env.DOCKERHUB_USERNAME }}/aegis-auth-service:$TAG \
            -n aegis

          kubectl set image deployment/user-service \
            user-service=${{ env.DOCKERHUB_USERNAME }}/aegis-user-service:$TAG \
            -n aegis

          kubectl set image deployment/order-service \
            order-service=${{ env.DOCKERHUB_USERNAME }}/aegis-order-service:$TAG \
            -n aegis

      # Wait for all rollouts to complete
      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/api-gateway   -n aegis --timeout=120s
          kubectl rollout status deployment/auth-service  -n aegis --timeout=120s
          kubectl rollout status deployment/user-service  -n aegis --timeout=120s
          kubectl rollout status deployment/order-service -n aegis --timeout=120s

      - name: Verify HPA status
        run: kubectl get hpa -n aegis

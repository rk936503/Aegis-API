name: CD — Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ── Build & Push Docker Images ──────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (git SHA short)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API Gateway ──────────────────────────────────────────────
      - name: Build & push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/aegis-api-gateway:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME }}/aegis-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Auth Service ─────────────────────────────────────────────
      - name: Build & push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/aegis-auth-service:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME }}/aegis-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── User Service ─────────────────────────────────────────────
      - name: Build & push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/aegis-user-service:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME }}/aegis-user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Order Service ────────────────────────────────────────────
      - name: Build & push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/aegis-order-service:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME }}/aegis-order-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to k3s on EC2 ────────────────────────────────────────────────────
  # ── Deploy to k3s on EC2 ────────────────────────────────────────────────────
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Deploy manifests and rollout images on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          TAG: ${{ needs.build-push.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Copy k8s manifests to EC2 node
          scp -r infra/k8s ec2-user@$EC2_HOST:~/k8s

          # Execute rollout directly on the k3s node
          ssh ec2-user@$EC2_HOST "bash -s" << EOF
            set -e

            # 1. Apply secrets
            kubectl create secret generic aegis-secrets \
              --namespace=aegis \
              --from-literal=JWT_SECRET='$JWT_SECRET' \
              --from-literal=JWT_REFRESH_SECRET='$JWT_REFRESH_SECRET' \
              --from-literal=POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
              --dry-run=client -o yaml | kubectl apply -f -

            # 2. Apply all Kubernetes manifests
            kubectl apply -f ~/k8s/00-namespace.yaml
            kubectl apply -f ~/k8s/postgres/
            kubectl apply -f ~/k8s/redis/

            # Wait for postgres to be ready and ensure databases exist
            kubectl rollout status deployment/postgres -n aegis --timeout=60s
            kubectl exec -n aegis deployment/postgres -- psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'aegis_users'" | grep -q 1 || kubectl exec -n aegis deployment/postgres -- psql -U postgres -c "CREATE DATABASE aegis_users;"
            kubectl exec -n aegis deployment/postgres -- psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'aegis_orders'" | grep -q 1 || kubectl exec -n aegis deployment/postgres -- psql -U postgres -c "CREATE DATABASE aegis_orders;"

            kubectl apply -f ~/k8s/auth-service/
            kubectl apply -f ~/k8s/user-service/
            kubectl apply -f ~/k8s/order-service/
            kubectl apply -f ~/k8s/api-gateway/

            # 3. Roll out new images

            kubectl set image deployment/api-gateway api-gateway=$DOCKERHUB_USERNAME/aegis-api-gateway:$TAG -n aegis
            kubectl set image deployment/auth-service auth-service=$DOCKERHUB_USERNAME/aegis-auth-service:$TAG -n aegis
            kubectl set image deployment/user-service user-service=$DOCKERHUB_USERNAME/aegis-user-service:$TAG -n aegis
            kubectl set image deployment/order-service order-service=$DOCKERHUB_USERNAME/aegis-order-service:$TAG -n aegis

            # 4. Wait for all rollouts to complete
            kubectl rollout status deployment/api-gateway   -n aegis --timeout=180s
            kubectl rollout status deployment/auth-service  -n aegis --timeout=180s
            kubectl rollout status deployment/user-service  -n aegis --timeout=180s
            kubectl rollout status deployment/order-service -n aegis --timeout=180s

            # 5. Output cluster state
            echo "=== HPA Status ==="
            kubectl get hpa -n aegis
            echo "=== Pods Status ==="
            kubectl get pods -n aegis
          EOF


name: CI — Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── API Gateway Tests ───────────────────────────────────────────────────────
  test-gateway:
    name: API Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: api-gateway

      - name: Run tests
        run: npm test
        working-directory: api-gateway

  # ── Auth Service Tests ──────────────────────────────────────────────────────
  test-auth:
    name: Auth Service Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aegis_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: auth-service/package.json

      - name: Install dependencies
        run: npm install
        working-directory: auth-service

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: auth-service

      - name: Apply Prisma schema
        run: npx prisma db push
        working-directory: auth-service
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/aegis_auth

      - name: Run tests
        run: npm test
        working-directory: auth-service
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/aegis_auth
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret
          JWT_REFRESH_SECRET: ci_test_refresh_secret

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aegis
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500     # Accessible at <EC2_IP>:30500
  type: NodePort          # k3s Klipper makes this reachable on the host
